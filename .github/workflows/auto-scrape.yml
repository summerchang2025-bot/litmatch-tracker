name: Auto Scrape & Update

on:
  schedule:
    # 每天 UTC 21:00 = 北京时间凌晨 5:00
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Run RSS scraper
        run: |
          python scripts/scrape_rss.py

      - name: Run peer agreement date checker
        run: |
          python scripts/check_peer_agreements.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data-supplement.js
          git commit -m "auto: daily scrape $(date -u +%Y-%m-%d)"
          git push
